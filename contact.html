<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Community — Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6ECD9;
      --surface: #dabae9;
      --surface2: #dabae9;
      --text: #6E3E99;
      --muted: #B9A6D1;
      --accent: #C19AFB;
      --brand-text: #8A6FD1;
      --font-ui: "DM Sans", system-ui, sans-serif;
      --brand-bar-gradient: linear-gradient(90deg,#C7E1FF,#F6C9DF);
      --title-color: #6E3E99;
      --subtitle-color: #B7A1D6;
      --panel-color: #dabae9;
      --panel-radius: 56px;
      --btn-bg: linear-gradient(180deg,#F8D6B7,#F4C9A8);
      --btn-text: #E07A4C;
      --btn-shadow: rgba(224,122,76,0.18);
      --panel-inset-shadow: rgba(0,0,0,0.06);
    }

    .dark-mode {
      --bg: #0f1219;
      --surface: #0f1117;
      --surface2: #151724;
      --text: #e8eaf0;
      --muted: #8b92a8;
      --accent: #7c9cff;
      --brand-bar-gradient: linear-gradient(90deg,#6f63a8,#7b63a8);
      --brand-text: #6b8cde;
      --title-color: #ffdfe9;
      --subtitle-color: #c6bfe0;
      --panel-color: #8f80b2;
      --btn-bg: linear-gradient(180deg,#dbeeff,#c7e0ff);
      --btn-text: #3b3b66;
      --btn-shadow: rgba(0,0,0,0.12);
      --panel-inset-shadow: rgba(0,0,0,0.12);
    }
    .dark-mode .brand-bar #home-btn { color: #6b8cde; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      transition: background .25s, color .25s;
    }

    /* ── brand bar ── */
    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--brand-bar-gradient);
      padding: 10px 18px;
      border-radius: 6px;
      margin: 28px 28px 18px;
      color: var(--brand-text);
      font-weight: 700;
      letter-spacing: .06em;
    }
    .brand-name {
      font-family: 'Fredoka One', system-ui, sans-serif;
      font-size: 1.05rem;
      color: var(--brand-text);
    }
    .brand-right { display: flex; align-items: center; gap: .6rem; opacity: .95; }

    .theme-toggle {
      border-radius: 12px;
      padding: .45rem .75rem;
      background: rgba(255,255,255,0.7);
      color: var(--title-color);
      cursor: pointer;
      border: 2px solid rgba(0,0,0,0.06);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 rgba(0,0,0,0.04);
      transition: transform .12s, box-shadow .12s;
      font-size: 1.15rem;
      line-height: 1;
    }
    .theme-toggle:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); }

    .sound-btn.active {
      background: var(--accent);
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* ── page wrap ── */
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }

    /* ── hero ── */
    .home-hero {
      text-align: center;
      padding: 2.25rem 1rem 1.75rem;
      position: relative;
      overflow: hidden;
    }
    .hero-title {
      font-family: 'Fredoka One', system-ui, sans-serif;
      font-size: clamp(2.2rem, 6vw, 3rem);
      color: var(--title-color);
      margin: 0 0 .45rem;
    }
    .hero-sub {
      color: var(--subtitle-color);
      font-size: .98rem;
      font-weight: 600;
    }
    .hero-star { position: absolute; width: 22px; height: 22px; }
    .hero-star.s1 { left: 6%; top: 22%; opacity: .9; }
    .hero-star.s2 { left: 18%; top: 58%; opacity: .4; filter: blur(1px); }
    .hero-star.s3 { right: 8%; top: 18%; opacity: .9; }

    /* ── panel / card ── */
    .hero-panel {
      background: var(--panel-color);
      border-radius: var(--panel-radius);
      padding: 2.75rem 2.5rem;
      box-shadow: inset -8px -8px 0 var(--panel-inset-shadow);
    }

    /* ── form ── */
    .form-group { margin-bottom: 1.4rem; text-align: left; }

    label {
      display: block;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--brand-text);
      margin-bottom: .42rem;
    }
    label .req { color: var(--btn-text); margin-left: .12rem; }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(255,255,255,0.55);
      border-radius: 14px;
      padding: .75rem 1.1rem;
      font-family: var(--font-ui);
      font-size: .97rem;
      color: var(--text);
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
      -webkit-appearance: none;
    }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(193,154,251,.22);
      background: rgba(255,255,255,0.82);
    }
    textarea { resize: vertical; min-height: 120px; line-height: 1.6; }

    /* ── submit ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 50px;
      padding: .85rem 2.2rem;
      font-family: var(--font-ui);
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .06em;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--btn-shadow);
      transition: transform .15s, box-shadow .15s, filter .15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--btn-shadow); filter: brightness(1.04); }
    .btn:active { transform: translateY(0); }
    .btn svg { transition: transform .2s; }
    .btn:hover svg { transform: translateX(3px); }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 1.75rem;
      padding-top: 1.4rem;
      border-top: 1.5px solid rgba(255,255,255,0.35);
    }
    .form-note { font-size: .8rem; color: var(--muted); }

    /* ── toast ── */
    #toast {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: var(--title-color);
      color: #fff;
      padding: .75rem 1.8rem;
      border-radius: 50px;
      font-size: .88rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }



    @media (max-width: 500px) {
      .hero-panel { padding: 2rem 1.25rem; border-radius: 32px; }
      .form-footer { flex-direction: column; align-items: flex-start; }
      .brand-bar { margin: 16px 16px 12px; }
    }
  </style>
</head>
<body>

  <div class="brand-bar">
    <a href="index.html" class="brand-name" style="text-decoration:none;">✦ DKMY ART</a>
    <div class="brand-right">
      <button id="home-btn" class="theme-toggle" aria-label="Go home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path d="M3 11.5L12 4l9 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M5 21.5V12h14v9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
      </button>
      <!-- Ambient Sound Buttons -->
      <button id="sound-thunder" class="sound-btn theme-toggle" data-sound="thunder" aria-label="Thunder" title="Thunder">⛈️</button>
      <button id="sound-cat" class="sound-btn theme-toggle" data-sound="cat" aria-label="Cat meows" title="Cat meows">🐱</button>
      <button id="sound-rain" class="sound-btn theme-toggle" data-sound="rain" aria-label="Rain" title="Rain">🌧️</button>
      <button id="sound-birds" class="sound-btn theme-toggle" data-sound="birds" aria-label="Forest birds" title="Forest birds">🐦</button>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="display: none;">
          <circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.6" fill="none"/>
          <path d="M12 1v6m0 12v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M1 12h6m12 0h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="display: block;">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="wrap">

    <div class="home-hero">
      <svg class="hero-star s1" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
        <path d="M11 1l2.5 7.5H21l-6 4.5 2.5 7.5L11 16 4.5 20.5 7 13 1 8.5h7.5L11 1z" fill="#C19AFB"/>
      </svg>
      <svg class="hero-star s2" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
        <path d="M11 1l2.5 7.5H21l-6 4.5 2.5 7.5L11 16 4.5 20.5 7 13 1 8.5h7.5L11 1z" fill="#C19AFB"/>
      </svg>
      <svg class="hero-star s3" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
        <path d="M11 1l2.5 7.5H21l-6 4.5 2.5 7.5L11 16 4.5 20.5 7 13 1 8.5h7.5L11 1z" fill="#F6C9DF"/>
      </svg>
      <h1 class="hero-title">Say Hello ✨</h1>
      <p class="hero-sub">We'd love to hear from the community</p>
    </div>

    <div class="hero-panel">
      <form id="contactForm" novalidate style="width:100%">

        <div class="form-group">
          <label for="name">Full Name <span class="req">*</span></label>
          <input type="text" id="name" name="name" placeholder="Your full name" required autocomplete="name"/>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
        </div>

        <div class="form-group">
          <label for="comments">Comments <span class="req">*</span></label>
          <textarea id="comments" name="comments" placeholder="Share your thoughts with us…" required></textarea>
        </div>

        <div class="form-footer">
          <span class="form-note"><span class="req">*</span> Required fields</span>
          <button type="submit" class="btn">
            Send Message
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8H13M9 4L13 8L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

      </form>
    </div>



  </div>

  <div id="toast"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = this.name.value.trim(), email = this.email.value.trim(), comments = this.comments.value.trim();
      if (!name || !email || !comments) { showToast('⚠ Please fill in all required fields.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('⚠ Please enter a valid email address.'); return; }
      this.reset();
      showToast('✨ Message sent — thank you!');
    });

    document.getElementById('theme-toggle').addEventListener('click', function() {
      document.body.classList.toggle('dark-mode');
      const sunIcon = this.querySelector('.sun-icon');
      const moonIcon = this.querySelector('.moon-icon');
      const isDark = document.body.classList.contains('dark-mode');
      sunIcon.style.display = isDark ? 'block' : 'none';
      moonIcon.style.display = isDark ? 'none' : 'block';
    });

    document.getElementById('home-btn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // Ambient sound controls using Web Audio API and audio files
    const activeSounds = new Map(); // Track active sound sources
    
    // Pre-load audio files
    const audioFiles = {
      ocean: null, // Keep synthesized
      thunder: 'juliush-heavy-rain-nature-sounds-8186.mp3',
      cat: 'geoffharvey-fat-cat-374614.mp3',
      rain: 'liecio-calming-rain-257596.mp3',
      birds: 'musicword-bird-flight-236928.mp3'
    };

    let audioCtx = null;

    function getOrCreateAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function stopSound(soundType) {
      if (activeSounds.has(soundType)) {
        const soundData = activeSounds.get(soundType);
        
        if (soundData.isAudioElement) {
          // For audio file
          soundData.audio.pause();
          soundData.audio.currentTime = 0;
        } else {
          // For Web Audio API
          soundData.oscillators.forEach(osc => osc.stop());
          soundData.noises.forEach(noise => noise.stop());
        }
        activeSounds.delete(soundType);
      }
    }

    function generateOcean() {
      const ctx = getOrCreateAudioContext();
      const oscillators = [];
      const noises = [];

      // Create wave-like effect with low frequency noise
      const noise = ctx.createBufferSource();
      const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
      noise.buffer = buffer;
      noise.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 200;
      filter.Q.value = 0.3;

      const gain = ctx.createGain();
      gain.gain.value = 0.15;

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
      noises.push(noise);

      return { oscillators, noises, isAudioElement: false };
    }

    function playAudioFile(soundType) {
      // Create a fresh audio instance for each playback
      const audio = new Audio(audioFiles[soundType]);
      if (!audio) return null;

      audio.loop = true;
      audio.currentTime = 0;
      audio.play().catch(err => console.log('Audio play error:', err));

      return { audio, isAudioElement: true };
    }

    function generateThunder() {
      return playAudioFile('thunder');
    }

    function generateCat() {
      return playAudioFile('cat');
    }

    function generateRain() {
      return playAudioFile('rain');
    }

    function generateBirds() {
      return playAudioFile('birds');
    }

    const soundGenerators = {
      ocean: generateOcean,
      thunder: generateThunder,
      cat: generateCat,
      rain: generateRain,
      birds: generateBirds
    };

    const soundButtons = document.querySelectorAll('.sound-btn');

    soundButtons.forEach(button => {
      button.addEventListener('click', () => {
        const soundType = button.dataset.sound;

        if (activeSounds.has(soundType)) {
          // Stop the sound
          stopSound(soundType);
          button.classList.remove('active');
        } else {
          // Stop any other playing sounds
          activeSounds.forEach((_, type) => {
            stopSound(type);
            const otherBtn = document.querySelector(`[data-sound="${type}"]`);
            if (otherBtn) otherBtn.classList.remove('active');
          });

          // Play the new sound
          const generator = soundGenerators[soundType];
          if (generator) {
            const soundData = generator();
            activeSounds.set(soundType, soundData);
            button.classList.add('active');
          }
        }
      });
    });
  </script>
</body>
</html>
